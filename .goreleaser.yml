# .goreleaser.yml
# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # Run tests before release
    - go test -v ./...

builds:
  # HTTP server binary (used by Docker image / standalone HTTP mode)
  - id: youtube-mcp
    main: ./cmd/server
    binary: youtube-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitCommit={{.ShortCommit}}
    mod_timestamp: '{{ .CommitTimestamp }}'

  # STDIO binary consumed by MCP clients (Claude Desktop / Cursor / Claude Code)
  - id: youtube-mcp-stdio
    main: ./cmd/mcp
    binary: youtube-mcp-stdio
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitCommit={{.ShortCommit}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  # No `ids`/`builds` filter is set, so GoReleaser packages ALL builds by default,
  # i.e. each archive contains both `youtube-mcp` (HTTP) and `youtube-mcp-stdio` (MCP stdio).
  - id: youtube-mcp
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*
      - docs/*
      - scripts/install-mcp.sh

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: 'Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Performance'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 'Refactors'
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999

dockers:
  - id: youtube-mcp
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/youtube-transcript-mcp:latest"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/youtube-transcript-mcp:{{ .Tag }}"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/youtube-transcript-mcp:{{ .Major }}"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/youtube-transcript-mcp:{{ .Major }}.{{ .Minor }}"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--platform=linux/amd64"

nfpms:
  - id: packages
    package_name: youtube-mcp
    vendor: YouTube Transcript MCP
    homepage: https://github.com/kimkiyong/youtube-mcp
    maintainer: Kim Kiyong <kimkiyong@example.com>
    description: YouTube Transcript MCP Server
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    dependencies:
      - ca-certificates
    bindir: /usr/bin
    section: utils
    priority: optional
    contents:
      - src: ./scripts/install-mcp.sh
        dst: /usr/share/youtube-mcp/install-mcp.sh
        file_info:
          mode: 0755
      - src: ./README.md
        dst: /usr/share/doc/youtube-mcp/README.md
        file_info:
          mode: 0644

# NOTE: brews/scoops are DISABLED for now.
# They publish to EXTERNAL tap repositories owned by a different account
# (kimkiyong/homebrew-tap, kimkiyong/scoop-bucket) and require Personal Access
# Token secrets (HOMEBREW_TAP_GITHUB_TOKEN / SCOOP_BUCKET_GITHUB_TOKEN) that do
# not currently exist. If left enabled, a missing token / missing tap repo makes
# the whole `goreleaser release` run hard-fail. They are commented out so core
# release artifacts (binaries, archives, checksums, GHCR image) can ship.
#
# To re-enable:
#   1. Create the tap repositories (e.g. kyong0612/homebrew-tap and
#      kyong0612/scoop-bucket) and update the `owner` fields below accordingly.
#   2. Create a GitHub PAT with `repo` scope on those repositories and register
#      it as Actions secrets HOMEBREW_TAP_GITHUB_TOKEN and SCOOP_BUCKET_GITHUB_TOKEN.
#   3. Expose those secrets to the GoReleaser step (env:) in .github/workflows/release.yml.
#   4. Uncomment the blocks below.
#
# brews:
#   - name: youtube-mcp
#     repository:
#       owner: kimkiyong
#       name: homebrew-tap
#       branch: main
#       token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
#     commit_author:
#       name: goreleaserbot
#       email: bot@goreleaser.com
#     commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
#     homepage: "https://github.com/kyong0612/youtube-mcp"
#     description: "YouTube Transcript MCP Server"
#     license: "MIT"
#     skip_upload: auto
#     test: |
#       system "#{bin}/youtube-mcp", "--version"
#     install: |
#       bin.install "youtube-mcp"
#
# scoops:
#   - repository:
#       owner: kimkiyong
#       name: scoop-bucket
#       branch: main
#       token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
#     commit_author:
#       name: goreleaserbot
#       email: bot@goreleaser.com
#     commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
#     homepage: "https://github.com/kyong0612/youtube-mcp"
#     description: "YouTube Transcript MCP Server"
#     license: "MIT"
#     skip_upload: auto

release:
  github:
    # The actual upstream repository is kyong0612/youtube-mcp.
    # The GitHub Release MUST be published there.
    owner: kyong0612
    name: youtube-mcp
  draft: false
  prerelease: auto
  mode: append
  name_template: "{{.ProjectName}}-v{{.Version}}"
  disable: false